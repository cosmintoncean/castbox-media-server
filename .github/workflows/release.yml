name: Build and publish CastBox release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set application version from release tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $source = Get-Content Program.cs -Raw
          $source = [regex]::Replace($source, 'private const string CurrentVersion = "[^"]+";', "private const string CurrentVersion = `"$version`";")
          Set-Content Program.cs $source

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: dotnet publish CastBox.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      # Screen sharing needs FFmpeg next to CastBox.exe (in an ffmpeg folder). Pinned to one release and checked against its
      # checksum; 8.0.x because FFmpeg 9 needs a newer NVIDIA driver than many PCs have for hardware encoding.
      - name: Bundle FFmpeg for screen sharing
        shell: pwsh
        run: |
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-essentials_build.zip'
          $sha256 = 'e2aaeaa0fdbc397d4794828086424d4aaa2102cef1fb6874f6ffd29c0b88b673'
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha256) { throw 'The FFmpeg download does not match the pinned checksum.' }
          Expand-Archive ffmpeg.zip ffmpeg-extract
          $root = Get-ChildItem ffmpeg-extract | Select-Object -First 1
          New-Item -ItemType Directory publish/ffmpeg | Out-Null
          Copy-Item "$($root.FullName)/bin/ffmpeg.exe" publish/ffmpeg/
          Copy-Item "$($root.FullName)/LICENSE" publish/ffmpeg/LICENSE.txt
          Copy-Item "$($root.FullName)/README.txt" publish/ffmpeg/README.txt
          Get-ChildItem publish/ffmpeg

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $iss = Get-Content installer/CastBox.iss -Raw
          $iss = [regex]::Replace($iss, '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`"")
          Set-Content installer/CastBox-release.iss $iss
          iscc installer/CastBox-release.iss

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer-output/CastBox-Setup.exe
